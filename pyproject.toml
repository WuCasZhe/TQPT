[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tqpt"
version = "0.1.0"
description = "Two-stage ChatGLM2-6B traffic classification with QLoRA routing and task-aware Prefix-Tuning."
readme = "README.md"
requires-python = ">=3.9,<3.11"
license = { text = "Research-only; see upstream model and dataset licenses." }
dependencies = [
  "PyYAML==6.0.1",
]

[project.optional-dependencies]
train = [
  "torch==2.1.0",
  "transformers==4.30.2",
  "peft==0.5.0",
  "bitsandbytes==0.41.1",
  "accelerate==0.21.0",
  "datasets==2.14.6",
  "pyarrow==12.0.1",
  "fsspec==2023.10.0",
  "huggingface-hub==0.17.3",
  "tokenizers==0.13.3",
  "sentencepiece==0.1.99",
  "protobuf==3.20.3",
  "numpy==1.24.4",
  "scikit-learn==1.3.2",
  "safetensors==0.3.3",
  "trl==0.4.7",
  "scipy==1.10.1",
  "jieba==0.42.1",
  "rouge-chinese==1.0.3",
  "nltk==3.8.1",
  "gradio==3.38.0",
  "uvicorn==0.23.2",
  "pydantic==1.10.13",
  "fastapi==0.95.1",
  "sse-starlette==1.6.5",
  "matplotlib==3.7.5",
]
test = [
  "pytest==7.4.4",
  "pytest-cov==4.1.0",
]

[project.scripts]
tqpt = "tqpt.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
